[project]
name = "steamlibrary"
version = "0.1.0"
description = "See what you can play from your steam library and family library"
readme = "README.md"
authors = [
    { name = "Redex95" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.4",
    "flask>=3.1.3",
    "requests>=2.34.2",
]

[project.scripts]
steamlibrary = "steamlibrary:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
